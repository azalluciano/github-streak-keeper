name: Keep GitHub Streak

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  keep-streak:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config user.name "TonNomGitHub"
          git config user.email "ton-email@example.com"

      - name: Do empty commit
        run: |
          git commit --allow-empty -m "🔥 Streak du $(date)"
          git push https://x-access-token:${GH_TOKEN}@github.com/azalluciano/github-streak-keeper.git
